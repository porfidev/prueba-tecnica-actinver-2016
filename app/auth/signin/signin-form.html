<form name="$ctrl.signinForm" form-validation valid-submit="$ctrl.signIn()" novalidate>
  <div
    class="form-group"
    ng-class="{
            'has-error': $ctrl.signinForm.username.$invalid &&
                ($ctrl.signinForm.username.$touched || $ctrl.signinForm.$submitted)
        }"
  >
    <label for="signin-email">Correo electrónico</label>
    <input
      type="email"
      id="signin-email"
      name="username"
      class="form-control"
      ng-model="$ctrl.user.username"
      autocomplete="username"
      required
    />
    <div
      class="help-block"
      ng-if="$ctrl.signinForm.username.$touched || $ctrl.signinForm.$submitted"
    >
      <span ng-if="$ctrl.signinForm.username.$error.required">El correo es obligatorio.</span>
      <span ng-if="$ctrl.signinForm.username.$error.email">Introduce un correo válido.</span>
    </div>
  </div>

  <div
    class="form-group"
    ng-class="{
            'has-error': $ctrl.signinForm.password.$invalid &&
                ($ctrl.signinForm.password.$touched || $ctrl.signinForm.$submitted)
        }"
  >
    <label for="signin-password">Contraseña</label>
    <input
      type="password"
      id="signin-password"
      name="password"
      class="form-control"
      ng-model="$ctrl.user.password"
      ng-trim="false"
      ng-maxlength="128"
      autocomplete="current-password"
      required
    />
    <div
      class="help-block"
      ng-if="$ctrl.signinForm.password.$touched || $ctrl.signinForm.$submitted"
    >
      <span ng-if="$ctrl.signinForm.password.$error.required">La contraseña es obligatoria.</span>
      <span ng-if="$ctrl.signinForm.password.$error.maxlength"
        >La contraseña admite hasta 128 caracteres.</span
      >
    </div>
  </div>

  <div class="alert alert-danger" ng-if="$ctrl.error" role="alert">{{ $ctrl.error }}</div>
  <button type="submit" class="btn btn-primary btn-block" ng-disabled="$ctrl.sending">
    {{ $ctrl.sending ? 'Iniciando sesión…' : 'Iniciar sesión' }}
  </button>
</form>
